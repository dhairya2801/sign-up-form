<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="main-container">

        <div id="image">
            <div id="image-1">
                <img src="./images/wallpaper.jpg" alt="nyc image">
            </div>
            <div id="image-2">
                <img src="./images/yankees.png" alt="yankees" id="yankees-img">
                <p class="img-2-text">NYC</p>
            </div>
        </div>

        <div id="content">
            <div class="header">
                <p>This is the greatest city on Earth. To have a chance to win a 
                    magnificent 5-day tour with transportation and accomodation
                    included, submit the form below!
                </p>
                <p>You know you want to.</p>
            </div>
            <div id="user-form">
                <p>Let's do this!</p>
                <form action="#" method="post" id="user-details">
                    <div class="tb-row-1">
                        <div>
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name">
                        </div>
                        <div>
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name">
                        </div>
                    </div>
                    <div class="tb-row-2">
                        <div>
                            <label for="user-email">EMAIL</label>
                            <input type="email" id="user-email">
                        </div>
                        <div>
                            <label for="user-phone">PHONE NUMBER</label>
                            <input type="number" id="user-phone">
                        </div>
                    </div>
                    <div class="tb-row-3">
                        <div>
                            <label for="user-pass">PASSWORD</label>
                            <input type="password" id="user-pass">
                        </div>
                        <div>
                            <label for="user-pass-cnf">CONFIRM PASSWORD</label>
                            <input type="password" id="user-pass-cnf">
                        </div>
                    </div>
                </form>
            </div>

            <div class="footer">
                <button id="create" type="submit" form="user-details">Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
            
        </div>
    </div>
</body>
</html>
